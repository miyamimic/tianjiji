<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>像素酒馆Canvas演示</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{
    background-color:#101010;
    display:flex;
    justify-content:center;
    padding-top:16px;
}
#canvas{
    image-rendering:pixelated;
    image-rendering:crisp-edges;
}
</style>
</head>
<body>
<canvas id="canvas"></canvas>

<script>
const canvas = document.querySelector("#canvas");
const ctx = canvas.getContext("2d");

//背景原图
const bgSource = new Image();
bgSource.src = "./welcome_bg.png";

//蒙版文件
const maskWindowImg = new Image();
maskWindowImg.src = "./window.png";

const maskClockImg = new Image();
maskClockImg.src = "./clock.png";

let rainList = [];
const rainCount = 85;

//初始化雨滴
function initRain() {
    rainList = [];
    for(let i = 0; i < rainCount; i++){
        rainList.push({
            x: Math.random() * 1700,
            y: Math.random() * 960,
            speed: Math.random() * 3 + 2.2,
            length: Math.random() * 7 + 3
        })
    }
}

//下雨函数，使用window.png蒙版裁剪
function drawRain(){
    if(!maskWindowImg.complete) return;

    ctx.save();
    ctx.drawImage(maskWindowImg,0,0);
    ctx.clip();

    ctx.fillStyle = 'rgba(210, 230, 255, 0.65)';
    for(let drop of rainList){
        drop.y += drop.speed;
        drop.x += (Math.random()-0.5)*0.4;

        if(drop.y > 960){
            drop.y = 0;
            drop.x = Math.random() * 1700;
        }
        ctx.fillRect(drop.x, drop.y, 1, drop.length);
    }

    ctx.restore();
}

bgSource.onload = function(){
    canvas.width = bgSource.width;
    canvas.height = bgSource.height;
    ctx.imageSmoothingEnabled = false;
    initRain();
    mainLoop();
};

function mainLoop(){
    ctx.drawImage(bgSource, 0, 0);

    drawRain();

    // drawFireParticles();
    // drawClock();

    requestAnimationFrame(mainLoop);
}
</script>
</body>
</html>
